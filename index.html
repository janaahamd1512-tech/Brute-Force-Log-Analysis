<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Log Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🛡️ Cyber Security Log Analyzer</h1>

        <p>Upload Authentication Log File</p>

        <input type="file" id="fileInput">

        <br><br>

        <button onclick="analyzeLogs()">
            Analyze Logs
        </button>

        <br><br>

        <h2>Risk Level</h2>

        <div class="risk-container">
            <div id="riskBar"></div>
        </div>

        <p id="riskText">No Data</p>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
